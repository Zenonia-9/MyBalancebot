<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>My Balance</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --surface2: #f7f8fa;
      --border: #e4e6ea;
      --text: #1a1a2e;
      --text-muted: #6b7280;
      --accent: #4f8ef7;
      --accent-light: #e8f0fe;
      --income: #10b981;
      --income-light: #d1fae5;
      --expense: #ef4444;
      --expense-light: #fee2e2;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 2px 12px rgba(0,0,0,0.07);
    }

    [data-theme="dark"] {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #16213e;
      --border: #2a2a45;
      --text: #e8eaf6;
      --text-muted: #8892b0;
      --accent: #6c9fff;
      --accent-light: #1a2a4a;
      --income: #34d399;
      --income-light: #064e3b;
      --expense: #f87171;
      --expense-light: #450a0a;
      --shadow: 0 2px 12px rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
      transition: background 0.2s, color 0.2s;
    }

    /* ── Header ── */
    .header {
      background: var(--surface);
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-title { font-size: 18px; font-weight: 700; }
    .header-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .settings-btn {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      width: 38px; height: 38px;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Balance Card ── */
    .balance-card {
      margin: 16px;
      background: linear-gradient(135deg, var(--accent) 0%, #7c3aed 100%);
      border-radius: var(--radius);
      padding: 24px 20px;
      color: #fff;
      box-shadow: 0 8px 24px rgba(79,142,247,0.3);
    }
    .balance-label { font-size: 13px; opacity: 0.85; margin-bottom: 6px; }
    .balance-amount { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; }
    .balance-row {
      display: flex;
      gap: 16px;
      margin-top: 16px;
    }
    .balance-stat {
      flex: 1;
      background: rgba(255,255,255,0.15);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }
    .balance-stat-label { font-size: 11px; opacity: 0.8; margin-bottom: 3px; }
    .balance-stat-value { font-size: 15px; font-weight: 700; }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      margin: 0 16px 16px;
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 4px;
      gap: 4px;
      box-shadow: var(--shadow);
    }
    .tab {
      flex: 1;
      padding: 9px 0;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
      border: none;
      background: transparent;
    }
    .tab.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(79,142,247,0.35);
    }

    /* ── Panel ── */
    .panel { display: none; padding: 0 16px; }
    .panel.active { display: block; }

    /* ── Add Form ── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .type-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .type-btn {
      flex: 1;
      padding: 10px;
      border-radius: var(--radius-sm);
      border: 2px solid var(--border);
      background: var(--surface2);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }
    .type-btn.income.active {
      border-color: var(--income);
      background: var(--income-light);
      color: var(--income);
    }
    .type-btn.expense.active {
      border-color: var(--expense);
      background: var(--expense-light);
      color: var(--expense);
    }

    .input-group { margin-bottom: 12px; }
    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .input-group input {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      color-scheme: light dark;
    }
    .input-group input:focus { border-color: var(--accent); }

    .btn-submit {
      width: 100%;
      padding: 13px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-submit:active { transform: scale(0.98); opacity: 0.9; }

    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: var(--bg);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s;
      z-index: 100;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── History ── */
    .tx-list { display: flex; flex-direction: column; gap: 8px; }
    .tx-item {
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
    }
    .tx-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .tx-icon.income { background: var(--income-light); }
    .tx-icon.expense { background: var(--expense-light); }
    .tx-info { flex: 1; min-width: 0; }
    .tx-note {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tx-date { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .tx-amount { font-size: 15px; font-weight: 700; flex-shrink: 0; }
    .tx-amount.income { color: var(--income); }
    .tx-amount.expense { color: var(--expense); }
    .tx-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
    }
    .tx-edit, .tx-delete { background: transparent; border: none; cursor: pointer; font-size: 17px; padding: 6px; border-radius: 8px; }
    .tx-edit { color: var(--accent); }
    .tx-edit:hover { background: var(--accent-light); }
    .tx-delete:hover { color: var(--expense); background: var(--expense-light); }

    .load-more {
      width: 100%;
      padding: 11px;
      margin-top: 10px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
    .empty-state .icon { font-size: 40px; margin-bottom: 10px; }
    .empty-state p { font-size: 14px; }

    /* ── Summary ── */
    .summary-period {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .period-btn {
      padding: 7px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .period-btn.active {
      border-color: var(--accent);
      background: var(--accent-light);
      color: var(--accent);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .summary-stat {
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .summary-stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .summary-stat-value { font-size: 20px; font-weight: 800; }
    .summary-stat-value.income { color: var(--income); }
    .summary-stat-value.expense { color: var(--expense); }

    .net-card {
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .net-label { font-size: 14px; font-weight: 600; color: var(--text-muted); }
    .net-value { font-size: 22px; font-weight: 800; }
    .net-value.positive { color: var(--income); }
    .net-value.negative { color: var(--expense); }

    /* ── Breakdown list ── */
    .breakdown-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .breakdown-title { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .year-nav { display: flex; align-items: center; gap: 8px; }
    .year-nav-btn {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      color: var(--text);
      width: 28px; height: 28px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .year-nav-label { font-size: 14px; font-weight: 700; min-width: 40px; text-align: center; }

    .breakdown-list { display: flex; flex-direction: column; gap: 6px; }
    .breakdown-row {
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      box-shadow: var(--shadow);
    }
    .breakdown-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .breakdown-label { font-size: 14px; font-weight: 700; }
    .breakdown-net { font-size: 14px; font-weight: 800; }
    .breakdown-net.positive { color: var(--income); }
    .breakdown-net.negative { color: var(--expense); }
    .breakdown-bar-wrap {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 6px;
      overflow: hidden;
    }
    .breakdown-bar-in {
      height: 100%;
      background: var(--income);
      border-radius: 2px;
      transition: width 0.4s ease;
    }
    .breakdown-sub {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }
    .breakdown-sub span.inc { color: var(--income); font-weight: 600; }
    .breakdown-sub span.exp { color: var(--expense); font-weight: 600; }

    /* ── Confirm Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 50;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 24px 20px;
      width: 100%;
      max-width: 480px;
    }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .modal-body { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; }
    .btn-cancel {
      flex: 1; padding: 12px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--border); background: var(--surface2);
      color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .btn-danger {
      flex: 1; padding: 12px; border-radius: var(--radius-sm);
      border: none; background: var(--expense);
      color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
    }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Cohere-inspired balance workspace ── */
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface2: #eeece7;
      --border: #d9d9dd;
      --text: #212121;
      --text-muted: #75758a;
      --accent: #1863dc;
      --accent-light: #f1f5ff;
      --income: #087d65;
      --income-light: #edfce9;
      --expense: #b30000;
      --expense-light: #fff0ed;
      --coral: #ff7759;
      --deep-green: #003c33;
      --radius: 16px;
      --radius-sm: 8px;
      --shadow: none;
    }
    [data-theme="dark"] {
      --bg: #071829;
      --surface: #10271f;
      --surface2: #17342b;
      --border: rgba(255,255,255,.18);
      --text: #ffffff;
      --text-muted: #c5c6cb;
      --accent: #8eb8ff;
      --accent-light: #18355a;
      --income: #78d9b5;
      --income-light: #164a3b;
      --expense: #ffad9b;
      --expense-light: #4d2926;
      --coral: #ffad9b;
      --deep-green: #003c33;
      --shadow: none;
    }
    body {
      max-width: 640px;
      margin: 0 auto;
      font-family: "Unica77 Cohere Web", Inter, Arial, ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0;
      background: var(--bg);
    }
    .announcement { display:flex; align-items:center; justify-content:space-between; min-height:36px; padding:0 16px; background:#000; color:#fff; font-size:12px; }
    .announcement-label { font-family: "CohereMono", ui-monospace, monospace; letter-spacing:.08em; text-transform:uppercase; }
    .announcement-status { color: var(--coral); }
    .header {
      background: var(--bg); border-bottom: 1px solid var(--border); padding: 20px 16px 16px;
    }
    .header-title { display:flex; align-items:center; gap:9px; font-family:"CohereText", "Space Grotesk", Inter, sans-serif; font-size:24px; font-weight:400; letter-spacing:-.04em; }
    .brand-mark { display:inline-grid; width:22px; height:22px; place-items:center; border-radius:50%; background:var(--coral); color:#17171c; font-family:ui-monospace,monospace; font-size:15px; font-weight:700; }
    .header-sub { margin-top: 5px; color: var(--text-muted); font-family:"CohereMono",ui-monospace,monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
    .settings-btn {
      width: 38px; height: 38px; background: transparent; border: 1px solid var(--border);
      border-radius: 50%; transition: transform .16s ease, background .16s ease; color:var(--text);
    }
    .settings-btn:active { transform: scale(.94); }
    .balance-card {
      margin: 0 16px 20px; background: var(--deep-green); border-radius: 22px;
      padding: 26px 22px 22px; box-shadow: none;
    }
    .balance-label { color:rgba(255,255,255,.72); font-family:"CohereMono",ui-monospace,monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
    .balance-amount { margin-top: 9px; font-family:"CohereText", "Space Grotesk", Inter, sans-serif; font-size:44px; font-weight:400; letter-spacing:-.055em; line-height:1; }
    .balance-row { gap: 0; margin-top: 28px; border-top:1px solid rgba(255,255,255,.22); }
    .balance-stat { background:transparent; border-radius:0; padding:14px 0 0; }
    .balance-stat + .balance-stat { border-left:1px solid rgba(255,255,255,.22); padding-left:16px; margin-left:16px; }
    .balance-stat-label { color:rgba(255,255,255,.7); font-family:"CohereMono",ui-monospace,monospace; font-size:10px; letter-spacing:.05em; text-transform:uppercase; }
    .balance-stat-value { margin-top:5px; font-size:16px; font-weight:400; }
    .tabs {
      position: sticky; top: 0; z-index: 9; margin: 0; padding:8px 16px 12px;
      background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter:blur(12px);
      border:0; border-bottom:1px solid var(--border); border-radius:0; gap:18px; box-shadow:none;
    }
    .tab { flex:0 0 auto; min-height:32px; padding:0; border-radius:0; font-family:"CohereMono",ui-monospace,monospace; font-size:11px; font-weight:400; letter-spacing:.05em; text-transform:uppercase; color:var(--text-muted); }
    .tab.active { background: transparent; color: var(--text); box-shadow: inset 0 -2px 0 var(--coral); }
    .panel { padding: 22px 16px 32px; }
    .card, .summary-stat, .net-card, .tx-item, .breakdown-row {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: none;
    }
    .card { padding: 22px; background:var(--surface2); }
    .card-title, .breakdown-title {
      color: var(--text); font-family:"CohereMono",ui-monospace,monospace; font-size:11px; font-weight:400; text-transform:uppercase; letter-spacing:.08em;
    }
    .type-toggle { padding:0; background:transparent; border-radius:0; gap:8px; }
    .type-btn { min-height:42px; border:1px solid var(--border); border-radius:999px; background:transparent; }
    .type-btn.income.active { border-color:var(--income); background:var(--income-light); color:var(--income); }
    .type-btn.expense.active { border-color:var(--expense); background:var(--expense-light); color:var(--expense); }
    .input-group { margin-bottom: 16px; }
    .input-group label { margin-bottom:7px; font-family:"CohereMono",ui-monospace,monospace; font-size:10px; font-weight:400; letter-spacing:.05em; text-transform:uppercase; }
    .input-group input, .input-group select {
      width:100%; min-height:50px; padding:13px 15px; border-radius:4px;
      border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:16px;
    }
    .input-group input:focus, .input-group select:focus { border-color:#9b60aa; outline:1px solid #9b60aa; }
    .btn-submit, .btn-confirm {
      min-height:46px; border:0; border-radius:999px; background:#17171c;
      color:#fff; font-size:14px; font-weight:500; transition:transform .16s ease, opacity .16s ease;
    }
    .btn-submit { padding: 13px 22px; }
    .btn-submit:active, .btn-confirm:active { transform: scale(.98); }
    .summary-period { padding:0; background:transparent; border-radius:0; gap:8px; }
    .period-btn { flex:1; min-height:38px; padding:7px 10px; border:1px solid var(--border); border-radius:999px; background:transparent; }
    .period-btn.active { border-color:var(--coral); background:transparent; color:var(--text); box-shadow:inset 0 0 0 1px var(--coral); }
    .summary-stat { padding:18px; background:var(--surface); }
    .summary-stat-value { font-family:"CohereText", "Space Grotesk", Inter, sans-serif; font-size:26px; font-weight:400; letter-spacing:-.04em; }
    .net-card { padding:18px; background:var(--deep-green); border-color:var(--deep-green); color:#fff; }
    .net-label { color:rgba(255,255,255,.75); }
    .net-value { font-family:"CohereText", "Space Grotesk", Inter, sans-serif; font-size:26px; font-weight:400; letter-spacing:-.04em; }
    .net-value.positive, .net-value.negative { color:#fff; }
    .tx-list, .breakdown-list { gap:0; border-top:1px solid var(--border); }
    .tx-item { min-height:76px; padding:14px 2px 14px 0; gap:10px; border:0; border-bottom:1px solid var(--border); border-radius:0; }
    .tx-icon { width:38px; height:38px; border-radius:8px; font-family:ui-monospace,monospace; font-size:18px; }
    .tx-note { font-size:15px; font-weight:400; }
    .tx-date { margin-top:4px; font-family:"CohereMono",ui-monospace,monospace; font-size:10px; letter-spacing:.04em; }
    .tx-amount { font-family:"CohereMono",ui-monospace,monospace; font-size:13px; font-weight:400; }
    .tx-edit, .tx-delete { min-width:34px; min-height:34px; border-radius:50%; }
    .load-more { min-height:44px; border:1px solid var(--border); border-radius:999px; background:transparent; }
    .year-nav-btn { width:34px; height:34px; border:1px solid var(--border); border-radius:50%; background:transparent; }
    .breakdown-row { padding:16px 0; border:0; border-bottom:1px solid var(--border); border-radius:0; }
    .breakdown-bar-wrap { height:4px; border-radius:0; }
    .breakdown-bar-in { border-radius:0; background:var(--coral); }
    .toast { bottom:24px; background:#17171c; color:#fff; border-radius:999px; padding:11px 18px; }
    .modal-overlay { background:rgba(0,0,0,.58); align-items:flex-end; padding:0; backdrop-filter:blur(6px); }
    .modal { max-width:640px; border:0; border-radius:22px 22px 0 0; padding:24px 20px 20px; }
    .modal-title { margin-bottom:16px; font-family:"CohereText", "Space Grotesk", Inter, sans-serif; font-size:26px; font-weight:400; letter-spacing:-.04em; }
    .modal-body { font-size: 14px; line-height: 1.43; }
    .modal-actions { gap: 8px; }
    .btn-cancel, .btn-danger, .btn-confirm { min-height:44px; border-radius:999px; font-size:14px; font-weight:500; }
    .btn-confirm { flex: 1; padding: 12px; cursor: pointer; }
    .btn-cancel { border:1px solid var(--border); background:transparent; }
    .btn-danger { background:var(--expense); }
    @media (min-width: 641px) {
      html { background: var(--bg); }
      body { min-height: 100vh; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
    }

    /* ── Clean electric-blue refresh: preserve the original compact hierarchy ── */
    :root {
      --bg: #f4f7fc;
      --surface: #ffffff;
      --surface2: #f7faf9;
      --border: #dce7e4;
      --text: #172b4d;
      --text-muted: #647694;
      --accent: #1479ff;
      --accent-light: #e1efff;
      --income: #178a57;
      --income-light: #e4f7ed;
      --expense: #d84a4a;
      --expense-light: #fde8e8;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 2px 12px rgba(20,75,165,.09);
    }
    [data-theme="dark"] {
      --bg: #0d1b35;
      --surface: #172b4d;
      --surface2: #1a3157;
      --border: #294d80;
      --text: #e8f1ff;
      --text-muted: #aac0dd;
      --accent: #58a6ff;
      --accent-light: #173e73;
      --income: #6fd58e;
      --income-light: #193f34;
      --expense: #ff8c8c;
      --expense-light: #50292b;
      --shadow: 0 2px 12px rgba(0,0,0,.24);
    }
    body { max-width:none; margin:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing:0; background:var(--bg); }
    .announcement { display:none; }
    .header { background:var(--surface); padding:16px 20px 12px; border-bottom:1px solid var(--border); }
    .header-title { display:block; font-family:inherit; font-size:18px; font-weight:700; letter-spacing:0; }
    .brand-mark { display:none; }
    .header-sub { margin-top:2px; font-family:inherit; font-size:12px; letter-spacing:0; text-transform:none; }
    .settings-btn { width:38px; height:38px; background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; color:var(--text); }
    .balance-card { margin:16px; background:linear-gradient(135deg, #1479ff 0%, #1854ad 100%); border-radius:var(--radius); padding:24px 20px; box-shadow:0 8px 24px rgba(20,121,255,.28); }
    [data-theme="dark"] .balance-card { background:linear-gradient(135deg, #176fd3 0%, #1b4f91 100%); border:0; }
    .balance-label { color:#fff; font-family:inherit; font-size:13px; letter-spacing:0; text-transform:none; opacity:.85; }
    .balance-amount { margin-top:4px; font-family:inherit; font-size:32px; font-weight:800; letter-spacing:-.5px; line-height:1.2; }
    .balance-row { gap:16px; margin-top:16px; border:0; }
    .balance-stat { background:rgba(255,255,255,.15); border-radius:var(--radius-sm); padding:10px 12px; }
    .balance-stat + .balance-stat { border:0; padding:10px 12px; margin-left:0; }
    .balance-stat-label { color:#fff; font-family:inherit; font-size:11px; letter-spacing:0; text-transform:none; opacity:.8; }
    .balance-stat-value { margin-top:3px; font-size:15px; font-weight:700; }
    .tabs { position:static; margin:0 16px 16px; padding:4px; gap:4px; background:var(--surface); backdrop-filter:none; border:0; border-radius:var(--radius-sm); box-shadow:var(--shadow); }
    .tab { flex:1; min-height:0; padding:9px 0; border-radius:8px; font-family:inherit; font-size:13px; font-weight:600; letter-spacing:0; text-transform:none; color:var(--text-muted); }
    .tab.active { background:var(--accent); color:#fff; box-shadow:0 2px 8px rgba(20,121,255,.28); }
    .panel { padding:0 16px; }
    .card, .summary-stat, .net-card, .tx-item, .breakdown-row { border:0; border-radius:var(--radius-sm); box-shadow:var(--shadow); }
    .card { padding:18px; margin-bottom:14px; background:var(--surface); }
    .card-title, .breakdown-title { font-family:inherit; color:var(--text-muted); font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
    .type-toggle { padding:0; background:transparent; border-radius:0; gap:8px; }
    .type-btn { min-height:0; padding:10px; border:2px solid var(--border); border-radius:var(--radius-sm); background:var(--surface2); }
    .type-btn.income.active { border:2px solid var(--income); background:var(--income-light); color:var(--income); }
    .type-btn.expense.active { border:2px solid var(--expense); background:var(--expense-light); color:var(--expense); }
    .input-group label { font-family:inherit; font-size:12px; font-weight:600; letter-spacing:0; text-transform:none; }
    .input-group input, .input-group select { min-height:0; padding:12px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--surface2); font-size:15px; }
    .input-group input:focus, .input-group select:focus { border-color:var(--accent); outline:0; }
    .btn-submit, .btn-confirm { min-height:0; background:var(--accent); border-radius:var(--radius-sm); font-size:15px; font-weight:700; }
    .summary-period { padding:0; background:transparent; border-radius:0; gap:8px; }
    .period-btn { min-height:0; padding:7px 14px; border:1.5px solid var(--border); border-radius:20px; background:var(--surface2); }
    .period-btn.active { border-color:var(--accent); background:var(--accent-light); color:var(--accent); box-shadow:none; }
    .summary-stat { padding:16px; background:var(--surface); }
    .summary-stat-value, .net-value { font-family:inherit; font-size:20px; font-weight:800; letter-spacing:0; }
    .net-card { padding:16px; background:var(--surface); border-color:transparent; color:var(--text); }
    .net-label { color:var(--text-muted); }
    .net-value.positive { color:var(--income); }
    .net-value.negative { color:var(--expense); }
    .tx-list, .breakdown-list { gap:8px; border:0; }
    .tx-item { min-height:0; padding:12px 14px; gap:12px; border:0; border-radius:var(--radius-sm); }
    .tx-icon { width:38px; height:38px; border-radius:50%; font-family:inherit; font-size:16px; }
    .tx-note { font-size:14px; font-weight:600; }
    .tx-date { margin-top:2px; font-family:inherit; font-size:11px; letter-spacing:0; }
    .tx-amount { font-family:inherit; font-size:15px; font-weight:700; }
    .tx-edit, .tx-delete { min-width:0; min-height:0; padding:4px; border-radius:6px; }
    .load-more { min-height:0; padding:11px; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); }
    .year-nav-btn { width:28px; height:28px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); }
    .breakdown-row { padding:12px 14px; border:0; border-radius:var(--radius-sm); }
    .breakdown-bar-wrap, .breakdown-bar-in { border-radius:2px; }
    .breakdown-bar-in { background:var(--income); }
    .modal-overlay { align-items:flex-end; padding:0; background:rgba(0,0,0,.5); backdrop-filter:none; }
    .modal { max-width:480px; border-radius:var(--radius) var(--radius) 0 0; padding:24px 20px; }
    .modal-title { font-family:inherit; font-size:16px; font-weight:700; letter-spacing:0; }
    .btn-cancel, .btn-danger, .btn-confirm { min-height:0; border-radius:var(--radius-sm); font-size:14px; font-weight:600; }
    .btn-cancel { background:var(--surface2); }
    .btn-danger { background:var(--expense); }
    @media (min-width: 641px) { body { max-width:560px; min-height:100vh; margin:0 auto; border-left:1px solid var(--border); border-right:1px solid var(--border); } }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="header-title">💼 My Balance</div>
      <div class="header-sub" id="username">Loading...</div>
    </div>
    <button class="settings-btn" onclick="openSettings()" title="Settings" aria-label="Settings">⚙️</button>
  </div>

  <!-- Balance Card -->
  <div class="balance-card">
    <div class="balance-label">Total Balance</div>
    <div class="balance-amount" id="balance-display">—</div>
    <div class="balance-row">
      <div class="balance-stat">
        <div class="balance-stat-label">↑ This month income</div>
        <div class="balance-stat-value" id="total-in-display">—</div>
      </div>
      <div class="balance-stat">
        <div class="balance-stat-label">↓ This month expense</div>
        <div class="balance-stat-value" id="total-out-display">—</div>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('add')">➕ Add</button>
    <button class="tab" onclick="switchTab('history')">📋 History</button>
    <button class="tab" onclick="switchTab('summary')">📊 Summary</button>
  </div>

  <!-- Add Panel -->
  <div class="panel active" id="panel-add">
    <div class="card">
      <div class="card-title">New Transaction</div>
      <div class="type-toggle">
        <button class="type-btn income active" id="btn-income" onclick="setType('in')">💰 Income</button>
        <button class="type-btn expense" id="btn-expense" onclick="setType('out')">💸 Expense</button>
      </div>
      <div class="input-group">
        <label>Amount (supports 10k, 1m)</label>
        <input id="amount-input" type="text" placeholder="e.g. 50000 or 50k" inputmode="decimal" />
      </div>
      <div class="input-group">
        <label>Note (optional)</label>
        <input id="note-input" type="text" placeholder="e.g. Salary, Coffee..." />
      </div>
      <div class="input-group">
        <label>Date &amp; Time (optional — defaults to now)</label>
        <input id="datetime-input" type="datetime-local" />
      </div>
      <button class="btn-submit" onclick="submitTransaction()">Add Transaction</button>
    </div>
  </div>

  <!-- History Panel -->
  <div class="panel" id="panel-history">
    <div class="tx-list" id="tx-list"></div>
    <button class="load-more" id="load-more-btn" onclick="loadMore()" style="display:none">Load More</button>
  </div>

  <!-- Summary Panel -->
  <div class="panel" id="panel-summary">
    <div class="card">
      <div class="card-title">Period</div>
      <div class="summary-period">
        <button class="period-btn active" onclick="setSummaryPeriod('month')">This Month</button>
        <button class="period-btn" onclick="setSummaryPeriod('year')">This Year</button>
        <button class="period-btn" onclick="setSummaryPeriod('all')">All Time</button>
      </div>

      <!-- This Month view -->
      <div id="summary-month-view">
        <div class="summary-grid">
          <div class="summary-stat">
            <div class="summary-stat-label">💰 Income</div>
            <div class="summary-stat-value income" id="sum-in">—</div>
          </div>
          <div class="summary-stat">
            <div class="summary-stat-label">💸 Expense</div>
            <div class="summary-stat-value expense" id="sum-out">—</div>
          </div>
        </div>
        <div class="net-card">
          <div class="net-label">💹 Net Balance</div>
          <div class="net-value" id="sum-net">—</div>
        </div>
      </div>

      <!-- This Year view -->
      <div id="summary-year-view" style="display:none">
        <div class="breakdown-header">
          <div class="breakdown-title">Monthly Breakdown</div>
          <div class="year-nav">
            <button class="year-nav-btn" onclick="shiftYear(-1)">‹</button>
            <div class="year-nav-label" id="year-nav-label"></div>
            <button class="year-nav-btn" onclick="shiftYear(1)">›</button>
          </div>
        </div>
        <div class="breakdown-list" id="monthly-list"></div>
      </div>

      <!-- All Time view -->
      <div id="summary-all-view" style="display:none">
        <div class="breakdown-header">
          <div class="breakdown-title">Yearly Breakdown</div>
        </div>
        <div class="breakdown-list" id="yearly-list"></div>
      </div>
    </div>
  </div>

  <!-- Delete Confirm Modal -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal">
      <div class="modal-title">🗑 Delete Transaction?</div>
      <div class="modal-body" id="delete-modal-body">This action cannot be undone.</div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn-danger" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="edit-modal">
    <div class="modal">
      <div class="modal-title">✎ Edit Transaction</div>
      <input type="hidden" id="edit-transaction-id" />
      <div class="input-group"><label>Type</label><select id="edit-type"><option value="in">Income</option><option value="out">Expense</option></select></div>
      <div class="input-group"><label>Amount</label><input id="edit-amount" type="number" min="0.01" step="0.01" /></div>
      <div class="input-group"><label>Note</label><input id="edit-note" type="text" /></div>
      <div class="input-group"><label>Date and time</label><input id="edit-datetime" type="datetime-local" /></div>
      <div class="modal-actions"><button class="btn-cancel" onclick="closeEditModal()">Cancel</button><button class="btn-confirm" onclick="saveEdit()">Save</button></div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <div class="modal-title">⚙️ Settings</div>
      <div class="input-group" style="margin-top:12px">
        <label>Currency Symbol</label>
        <input id="settings-currency" type="text" placeholder="e.g. MMK, USD, THB" maxlength="10" />
      </div>
      <div class="input-group">
        <label>Timezone</label>
        <input id="settings-timezone" type="text" placeholder="e.g. Asia/Rangoon, Asia/Bangkok" />
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px" id="tz-detected"></div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeSettings()">Cancel</button>
        <button class="btn-submit" style="flex:1" onclick="saveSettings()">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/static/app.js"></script>
</body>
</html>
